services:

  mysql:
    image: mysql:8.0
    container_name: ingenium-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  wildfly:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ingenium-wildfly
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9990:9990"
    depends_on:
      mysql:
        condition: service_healthy

  sonarqube:
    image: sonarqube:lts-community
    container_name: ingenium-sonarqube
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs

  sonar-db:
    image: postgres:15
    container_name: ingenium-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonar-provisioner:
    image: curlimages/curl:latest
    container_name: ingenium-sonar-provisioner
    depends_on:
      sonarqube:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      echo 'Aguardando SonarQube ficar online...';
      until [ \"$$(curl -s -o /dev/null -w ''%{http_code}'' http://sonarqube:9000/api/system/status)\" == \"200\" ]; do
        sleep 5;
      done;
      echo 'SonarQube online! Verificando credenciais...';
      # Tenta mudar a senha de admin para 123456 (funciona apenas no primeiro boot ou após reset de volume)
      curl -s -u admin:admin -X POST 'http://sonarqube:9000/api/users/change_password?login=admin&previousPassword=admin&password=123456';
      
      echo 'Configurando Quality Gate Agressivo...';
      # Agora usa a senha 123456 para as demais operações
      curl -s -u admin:123456 -X POST 'http://sonarqube:9000/api/qualitygates/create?name=Agressivo-90';
      curl -s -u admin:123456 -X POST 'http://sonarqube:9000/api/qualitygates/create_condition?gateName=Agressivo-90&metric=coverage&op=LT&error=90';
      curl -s -u admin:123456 -X POST 'http://sonarqube:9000/api/qualitygates/create_condition?gateName=Agressivo-90&metric=bugs&op=GT&error=0';
      curl -s -u admin:123456 -X POST 'http://sonarqube:9000/api/qualitygates/set_as_default?name=Agressivo-90';
      echo 'Configuração concluída com sucesso!';
      "

volumes:
  mysql_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  sonar_db_data:
