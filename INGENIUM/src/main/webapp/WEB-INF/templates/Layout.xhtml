<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      lang="pt-br"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
<f:view contentType="text/html">
    <ui:insert name="metadata" />

    <h:head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Ingenium</title>
        <h:outputStylesheet library="css" name="app.css" />
    </h:head>

    <h:body styleClass="app-shell app-auth">
        <header class="app-topbar">
            <div class="app-topbar__inner">
                <h:link outcome="/telaLogado.xhtml" styleClass="brand">
                    <span class="brand__logo-wrap">
                        <h:graphicImage library="img" name="logo.png" styleClass="brand__logo" alt="Ingenium" />
                    </span>
                    <span class="brand__label">Ingenium</span>
                </h:link>

                <nav class="app-nav" aria-label="Navegação principal">
                    <h:link outcome="/telaLogado.xhtml" value="Painel" />
                    <h:link outcome="/uc/categoria/consultaCategoria.xhtml" value="Categorias" />
                    <h:link outcome="/uc/objetivo/consultaObjetivo.xhtml" value="Objetivos" />
                    <h:link outcome="/uc/usuario/alteraUsuario.xhtml" value="Perfil" />
                </nav>

                <h:form id="sessionForm" styleClass="session-panel">
                    <h:outputText styleClass="session-panel__user" value="#{userSession.fullName}" />
                    <p:commandButton value="Sair"
                                     action="#{authBean.logout()}"
                                     styleClass="btn btn-secondary"
                                     title="Encerrar sessão" />
                </h:form>
            </div>
        </header>

        <main class="app-main">
            <div class="app-main__inner">
                <ui:insert name="corpo" />
            </div>
        </main>

        <footer class="app-footer">
            <b>Ingenium</b> - Planejamento e acompanhamento de objetivos
        </footer>

        <h:form id="confirmForm">
            <p:confirmDialog global="true" styleClass="confirm-dialog" showEffect="fade" hideEffect="fade">
                <p:commandButton value="Confirmar" type="button" styleClass="ui-confirmdialog-yes btn btn-primary" />
                <p:commandButton value="Cancelar" type="button" styleClass="ui-confirmdialog-no btn btn-secondary" />
            </p:confirmDialog>
        </h:form>

        <h:outputScript library="js" name="main.js" />
    </h:body>
</f:view>
</html>
