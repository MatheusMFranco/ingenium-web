<!DOCTYPE html>
<ui:composition template="/WEB-INF/templates/LayoutDeslogado.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">

    <ui:define name="corpo">
        <h:form id="frm" styleClass="surface-card auth-card">
            <div class="auth-card__intro">
                <h1 class="auth-card__title">Acesse sua conta</h1>
                <p class="auth-card__subtitle">Entre para gerenciar suas categorias e objetivos.</p>
            </div>

            <p:messages id="mensagem" closable="true" showDetail="true" />

            <div class="form-grid form-grid--single">
                <div class="form-field">
                    <p:outputLabel value="Usuário" for="username" indicateRequired="true" />
                    <p:inputText id="username"
                                 required="true"
                                 value="#{authBean.username}"
                                 maxlength="30"
                                 placeholder="Informe seu usuário"
                                 title="Informe seu usuário" />
                </div>

                <div class="form-field">
                    <p:outputLabel value="Senha" for="senha" indicateRequired="true" />
                    <p:password id="senha"
                                required="true"
                                value="#{authBean.password}"
                                feedback="false"
                                redisplay="true"
                                placeholder="Informe sua senha"
                                title="Informe sua senha" />
                </div>
            </div>

            <div class="form-actions">
                <p:commandButton value="Entrar"
                                 action="#{authBean.login()}"
                                 update=":frm:mensagem :frm"
                                 styleClass="btn btn-primary" />

                <p:commandButton value="Limpar"
                                 type="button"
                                 styleClass="btn btn-secondary js-clear-form" />
            </div>

            <p class="auth-card__hint">
                Primeiro acesso?
                <h:link outcome="/uc/usuario/cadastraUsuario.xhtml" value="Criar conta" />
            </p>
        </h:form>
    </ui:define>
</ui:composition>
