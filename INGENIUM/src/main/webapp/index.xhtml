<!DOCTYPE html>
<ui:composition template="/WEB-INF/templates/LayoutDeslogado.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets">

    <ui:define name="corpo">
        <section class="surface-card page-card page-card--center">
            <h1 class="page-title">Preparando seu painel</h1>
            <p class="page-subtitle">Você será redirecionado automaticamente.</p>
            <span class="status-pill">Redirecionando...</span>

            <h:outputScript>
                setTimeout(function () {
                    window.location.href = "#{request.contextPath}/telaLogado.xhtml";
                }, 700);
            </h:outputScript>
        </section>
    </ui:define>
</ui:composition>
