<!DOCTYPE html>
<ui:composition template="/WEB-INF/templates/Layout.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">

    <ui:define name="metadata">
        <f:metadata>
            <f:viewAction action="#{userBean.loadProfile()}" onPostback="false" />
        </f:metadata>
    </ui:define>

    <ui:define name="corpo">
        <h:form id="frm" styleClass="surface-card form-card">
            <div class="form-card__header">
                <h1 class="form-card__title">Meu perfil</h1>
                <p class="form-card__subtitle">Atualize seus dados cadastrais e credenciais de acesso.</p>
            </div>

            <p class="required-note">(<span>*</span>) Campos obrigatórios</p>
            <p:messages id="mensagem" closable="true" showDetail="true" />

            <div class="form-grid">
                <div class="form-field">
                    <p:outputLabel for="username" value="Usuário" />
                    <p:inputText id="username" disabled="true" value="#{userBean.user.username}" />
                </div>

                <div class="form-field">
                    <p:outputLabel value="Nome completo" for="nomeUsu" />
                    <p:inputText id="nomeUsu" maxlength="100" value="#{userBean.user.fullName}" />
                </div>

                <div class="form-field form-field--full">
                    <p:outputLabel value="Descrição" for="descricaoUsu" />
                    <p:inputTextarea id="descricaoUsu"
                                     maxlength="255"
                                     autoResize="false"
                                     rows="3"
                                     value="#{userBean.user.description}" />
                </div>

                <div class="form-field">
                    <p:outputLabel value="E-mail" for="emailUsu" indicateRequired="true" />
                    <p:inputText id="emailUsu" required="true" maxlength="100" value="#{userBean.user.email}" />
                </div>

                <div class="form-field">
                    <p:outputLabel value="Nova senha" for="senhaUsu" />
                    <p:password id="senhaUsu"
                                value="#{userBean.user.password}"
                                feedback="true"
                                promptLabel="Digite uma nova senha"
                                weakLabel="Fraca"
                                goodLabel="Boa"
                                strongLabel="Forte"
                                placeholder="Deixe em branco para manter a senha atual" />
                </div>

                <div class="form-field">
                    <p:outputLabel value="Confirmação de senha" for="senhaCUsu" />
                    <p:password id="senhaCUsu"
                                feedback="false"
                                value="#{userBean.confirmPassword}"
                                placeholder="Repita a nova senha" />
                </div>
            </div>

            <div class="form-actions">
                <p:commandButton value="Salvar alterações"
                                 action="#{userBean.updateProfile()}"
                                 update=":frm :frm:mensagem"
                                 styleClass="btn btn-primary" />

                <p:commandButton value="Excluir conta"
                                 action="#{userBean.deleteProfile()}"
                                 update=":frm :frm:mensagem"
                                 styleClass="btn btn-danger">
                    <p:confirm header="Excluir conta"
                               message="Confirma a exclusão da conta? Essa ação remove todos os dados cadastrados."
                               icon="ui-icon-alert" />
                </p:commandButton>

                <p:commandButton value="Limpar"
                                 type="button"
                                 styleClass="btn btn-secondary js-clear-form" />
            </div>
        </h:form>
    </ui:define>
</ui:composition>
