<!DOCTYPE html>
<ui:composition template="/WEB-INF/templates/LayoutDeslogado.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">

    <ui:define name="corpo">
        <h:form id="frm" styleClass="surface-card form-card">
            <div class="form-card__header">
                <h1 class="form-card__title">Criar nova conta</h1>
                <p class="form-card__subtitle">Preencha seus dados para iniciar o planejamento dos seus objetivos.</p>
            </div>

            <p class="required-note">(<span>*</span>) Campos obrigatórios</p>
            <p:messages id="mensagem" closable="true" showDetail="true" />

            <div class="form-grid">
                <div class="form-field">
                    <p:outputLabel value="Usuário" for="username" indicateRequired="true" />
                    <p:inputText id="username"
                                 required="true"
                                 maxlength="15"
                                 value="#{userBean.user.username}"
                                 placeholder="Ex.: geninho"
                                 title="Informe seu usuário" />
                </div>

                <div class="form-field">
                    <p:outputLabel value="Nome completo" for="nomeUsu" />
                    <p:inputText id="nomeUsu"
                                 maxlength="100"
                                 value="#{userBean.user.fullName}"
                                 placeholder="Ex.: Geninho Silva"
                                 title="Informe seu nome completo" />
                </div>

                <div class="form-field form-field--full">
                    <p:outputLabel value="Descrição" for="descricaoUsu" />
                    <p:inputTextarea id="descricaoUsu"
                                     maxlength="255"
                                     value="#{userBean.user.description}"
                                     autoResize="false"
                                     rows="3"
                                     placeholder="Descreva seu foco principal de uso da aplicação"
                                     title="Informe uma descrição do perfil" />
                </div>

                <div class="form-field">
                    <p:outputLabel value="E-mail" for="emailUsu" indicateRequired="true" />
                    <p:inputText id="emailUsu"
                                 required="true"
                                 maxlength="100"
                                 value="#{userBean.user.email}"
                                 placeholder="nome@dominio.com"
                                 title="Informe seu e-mail" />
                </div>

                <div class="form-field">
                    <p:outputLabel value="Confirmação de e-mail" for="emailCUsu" indicateRequired="true" />
                    <p:inputText id="emailCUsu"
                                 required="true"
                                 maxlength="100"
                                 value="#{userBean.confirmEmail}"
                                 placeholder="Repita o e-mail"
                                 title="Confirme o e-mail informado" />
                </div>

                <div class="form-field">
                    <p:outputLabel value="Senha" for="senhaUsu" indicateRequired="true" />
                    <p:password id="senhaUsu"
                                required="true"
                                value="#{userBean.user.password}"
                                feedback="true"
                                promptLabel="Digite uma senha"
                                weakLabel="Fraca"
                                goodLabel="Boa"
                                strongLabel="Forte"
                                placeholder="Informe sua senha" />
                </div>

                <div class="form-field">
                    <p:outputLabel value="Confirmação de senha" for="senhaCUsu" indicateRequired="true" />
                    <p:password id="senhaCUsu"
                                required="true"
                                value="#{userBean.confirmPassword}"
                                feedback="false"
                                placeholder="Repita a senha" />
                </div>
            </div>

            <div class="form-actions">
                <p:commandButton value="Salvar cadastro"
                                 action="#{userBean.register()}"
                                 update=":frm:mensagem :frm"
                                 styleClass="btn btn-primary" />

                <p:commandButton value="Limpar"
                                 type="button"
                                 styleClass="btn btn-secondary js-clear-form" />
            </div>

            <p class="form-card__hint">
                Já possui conta?
                <h:link outcome="/login.xhtml" value="Entrar" />
            </p>
        </h:form>
    </ui:define>
</ui:composition>
