<!DOCTYPE html>
<ui:composition template="/WEB-INF/templates/Layout.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">

    <ui:define name="corpo">
        <h:form id="frmLista" styleClass="surface-card table-shell">
            <div class="table-shell__header">
                <div>
                    <h1 class="table-shell__title">Categorias cadastradas</h1>
                    <p class="table-shell__subtitle">Consulte, filtre e edite suas categorias de planejamento.</p>
                </div>

                <p:button value="Nova categoria"
                          outcome="cadastraCategoria.xhtml"
                          styleClass="btn btn-primary">
                    <f:param name="catAcao" value="Novo" />
                </p:button>
            </div>

            <p:messages id="mensagem" closable="true" showDetail="true" />

            <p:dataTable var="categoria"
                         value="#{categoryBean.list()}"
                         id="tabCategoria"
                         emptyMessage="Nenhuma categoria encontrada"
                         rows="10"
                         paginator="true"
                         reflow="true"
                         paginatorPosition="bottom"
                         currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords}"
                         paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}">

                <p:column headerText="Ações" style="width:180px">
                    <div class="table-actions">
                        <p:button value="Editar" outcome="cadastraCategoria.xhtml" styleClass="btn-inline btn-secondary">
                            <f:param name="catCod" value="#{categoria.id}" />
                            <f:param name="catAcao" value="Alterar" />
                        </p:button>

                        <p:button value="Excluir" outcome="cadastraCategoria.xhtml" styleClass="btn-inline btn-danger">
                            <f:param name="catCod" value="#{categoria.id}" />
                            <f:param name="catAcao" value="Excluir" />
                        </p:button>
                    </div>
                </p:column>

                <p:column headerText="Nome" filterBy="#{categoria.name}" filterMatchMode="contains">
                    <h:outputText value="#{categoria.name}" />
                </p:column>

                <p:column headerText="Descrição" filterBy="#{categoria.description}" filterMatchMode="contains">
                    <h:outputText value="#{categoria.description}" />
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
