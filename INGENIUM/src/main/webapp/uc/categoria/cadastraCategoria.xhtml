<!DOCTYPE html>
<ui:composition template="/WEB-INF/templates/Layout.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="catAcao" value="#{categoryBean.action}" />
            <f:viewParam name="catCod" value="#{categoryBean.categoryId}" />
            <f:viewAction action="#{categoryBean.loadCategory()}" onPostback="false" />
        </f:metadata>
    </ui:define>

    <ui:define name="corpo">
        <h:form id="frm" styleClass="surface-card form-card">
            <div class="form-card__header">
                <h:panelGroup rendered="#{categoryBean.action == 'Novo' or empty categoryBean.action}">
                    <h1 class="form-card__title">Nova categoria</h1>
                    <p class="form-card__subtitle">Crie uma categoria para organizar seus objetivos.</p>
                </h:panelGroup>
                <h:panelGroup rendered="#{categoryBean.action == 'Alterar'}">
                    <h1 class="form-card__title">Editar categoria</h1>
                    <p class="form-card__subtitle">Atualize os dados da categoria selecionada.</p>
                </h:panelGroup>
                <h:panelGroup rendered="#{categoryBean.action == 'Excluir'}">
                    <h1 class="form-card__title">Excluir categoria</h1>
                    <p class="form-card__subtitle">Revise os dados antes de confirmar a exclusão.</p>
                </h:panelGroup>
            </div>

            <p class="required-note" rendered="#{categoryBean.action != 'Excluir'}">(<span>*</span>) Campos obrigatórios</p>
            <p:messages id="mensagem" closable="true" showDetail="true" />

            <div class="form-grid form-grid--single">
                <div class="form-field">
                    <p:outputLabel value="Nome" for="nomeCat" indicateRequired="#{categoryBean.action != 'Excluir'}" />
                    <h:outputText styleClass="readonly-value"
                                  value="#{categoryBean.category.name}"
                                  rendered="#{categoryBean.action == 'Excluir'}" />
                    <p:inputText id="nomeCat"
                                 rendered="#{categoryBean.action != 'Excluir'}"
                                 required="true"
                                 maxlength="100"
                                 value="#{categoryBean.category.name}"
                                 placeholder="Ex.: Gramática Japonesa" />
                </div>

                <div class="form-field">
                    <p:outputLabel value="Descrição" for="descricaoCat" />
                    <h:outputText styleClass="readonly-value"
                                  value="#{categoryBean.category.description}"
                                  rendered="#{categoryBean.action == 'Excluir'}" />
                    <p:inputTextarea id="descricaoCat"
                                     rendered="#{categoryBean.action != 'Excluir'}"
                                     maxlength="255"
                                     autoResize="false"
                                     rows="3"
                                     value="#{categoryBean.category.description}"
                                     placeholder="Contexto da categoria" />
                </div>
            </div>

            <div class="form-actions">
                <p:commandButton value="Salvar categoria"
                                 action="#{categoryBean.create()}"
                                 update=":frm:mensagem :frm"
                                 styleClass="btn btn-primary"
                                 rendered="#{categoryBean.action != 'Excluir' and categoryBean.action != 'Alterar'}" />

                <p:commandButton value="Atualizar categoria"
                                 action="#{categoryBean.update()}"
                                 update=":frm:mensagem :frm"
                                 styleClass="btn btn-primary"
                                 rendered="#{categoryBean.action == 'Alterar'}" />

                <p:commandButton value="Confirmar exclusão"
                                 action="#{categoryBean.deleteAndRedirect()}"
                                 styleClass="btn btn-danger"
                                 rendered="#{categoryBean.action == 'Excluir'}" />

                <p:commandButton value="Limpar"
                                 type="button"
                                 styleClass="btn btn-secondary js-clear-form"
                                 rendered="#{categoryBean.action != 'Excluir'}" />

                <p:button value="Voltar"
                          styleClass="btn btn-subtle"
                          outcome="/uc/categoria/consultaCategoria.xhtml" />
            </div>
        </h:form>
    </ui:define>
</ui:composition>
