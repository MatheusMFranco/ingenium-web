<!DOCTYPE html>
<ui:composition template="/WEB-INF/templates/Layout.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="objAcao" value="#{goalBean.action}" />
            <f:viewParam name="objCod" value="#{goalBean.goalId}" />
            <f:viewAction action="#{goalBean.loadGoal()}" onPostback="false" />
        </f:metadata>
    </ui:define>

    <ui:define name="corpo">
        <h:form id="frm" styleClass="surface-card form-card">
            <div class="form-card__header">
                <h:panelGroup rendered="#{goalBean.action == 'Novo' or empty goalBean.action}">
                    <h1 class="form-card__title">Novo objetivo</h1>
                    <p class="form-card__subtitle">Defina o objetivo, prazo e categoria para acompanhamento.</p>
                </h:panelGroup>
                <h:panelGroup rendered="#{goalBean.action == 'Alterar'}">
                    <h1 class="form-card__title">Editar objetivo</h1>
                    <p class="form-card__subtitle">Ajuste dados de planejamento do objetivo selecionado.</p>
                </h:panelGroup>
                <h:panelGroup rendered="#{goalBean.action == 'Excluir'}">
                    <h1 class="form-card__title">Excluir objetivo</h1>
                    <p class="form-card__subtitle">Confirme os dados abaixo antes de remover o objetivo.</p>
                </h:panelGroup>
            </div>

            <p class="required-note" rendered="#{goalBean.action != 'Excluir'}">(<span>*</span>) Campos obrigatórios</p>
            <p:messages id="mensagem" closable="true" showDetail="true" />

            <div class="form-grid">
                <div class="form-field">
                    <p:outputLabel value="Nome" for="nomeObj" indicateRequired="#{goalBean.action != 'Excluir'}" />
                    <h:outputText styleClass="readonly-value"
                                  value="#{goalBean.goal.name}"
                                  rendered="#{goalBean.action == 'Excluir'}" />
                    <p:inputText id="nomeObj"
                                 rendered="#{goalBean.action != 'Excluir'}"
                                 required="true"
                                 maxlength="100"
                                 value="#{goalBean.goal.name}"
                                 placeholder="Ex.: Estudar pronomes" />
                </div>

                <div class="form-field">
                    <p:outputLabel value="Categoria" for="catObj" indicateRequired="#{goalBean.action != 'Excluir'}" />
                    <h:outputText styleClass="readonly-value"
                                  value="#{goalBean.goal.category.name}"
                                  rendered="#{goalBean.action == 'Excluir'}" />
                    <p:selectOneMenu id="catObj"
                                     rendered="#{goalBean.action != 'Excluir'}"
                                     required="true"
                                     autoWidth="false"
                                     appendTo="@(body)"
                                     value="#{goalBean.selectedCategoryId}">                        <f:selectItem itemLabel="Selecione uma categoria" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{goalBean.availableCategories}" var="categoriaObj"
                                       itemValue="#{categoriaObj.id}" itemLabel="#{categoriaObj.name}" />
                    </p:selectOneMenu>
                </div>

                <div class="form-field">
                    <p:outputLabel value="Tipo de duração" for="tipoObj" indicateRequired="#{goalBean.action != 'Excluir'}" />
                    <h:outputText styleClass="readonly-value"
                                  value="#{goalBean.goal.durationType.label}"
                                  rendered="#{goalBean.action == 'Excluir'}" />
                    <p:selectOneMenu id="tipoObj"
                                     rendered="#{goalBean.action != 'Excluir'}"
                                     required="true"
                                     autoWidth="false"
                                     appendTo="@(body)"
                                     value="#{goalBean.goal.durationType}">
                        <f:selectItem itemLabel="Selecione o tipo de duração" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{goalBean.durationTypes}" var="tipoDuracao"
                                       itemValue="#{tipoDuracao}" itemLabel="#{tipoDuracao.label}" />
                    </p:selectOneMenu>
                </div>

                <div class="form-field">
                    <p:outputLabel value="Data inicial" for="dataInicial" indicateRequired="#{goalBean.action != 'Excluir'}" />
                    <h:outputText styleClass="readonly-value" rendered="#{goalBean.action == 'Excluir'}">
                        <h:outputText value="#{goalBean.goal.startDate}">
                            <f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
                        </h:outputText>
                    </h:outputText>
                    <p:datePicker id="dataInicial"
                                  rendered="#{goalBean.action != 'Excluir'}"
                                  value="#{goalBean.goal.startDate}"
                                  pattern="dd/MM/yyyy"
                                  required="true"
                                  mask="true" />
                </div>

                <div class="form-field">
                    <p:outputLabel value="Data final" for="dataFinal" indicateRequired="#{goalBean.action != 'Excluir'}" />
                    <h:outputText styleClass="readonly-value" rendered="#{goalBean.action == 'Excluir'}">
                        <h:outputText value="#{goalBean.goal.endDate}">
                            <f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
                        </h:outputText>
                    </h:outputText>
                    <p:datePicker id="dataFinal"
                                  rendered="#{goalBean.action != 'Excluir'}"
                                  value="#{goalBean.goal.endDate}"
                                  pattern="dd/MM/yyyy"
                                  required="true"
                                  mask="true" />
                </div>

                <div class="form-field form-field--full">
                    <p:outputLabel value="Descrição" for="descricaoObj" />
                    <h:outputText styleClass="readonly-value"
                                  value="#{goalBean.goal.description}"
                                  rendered="#{goalBean.action == 'Excluir'}" />
                    <p:inputTextarea id="descricaoObj"
                                     rendered="#{goalBean.action != 'Excluir'}"
                                     maxlength="255"
                                     autoResize="false"
                                     rows="3"
                                     value="#{goalBean.goal.description}"
                                     placeholder="Detalhes do objetivo" />
                </div>
            </div>

            <div class="form-actions">
                <p:commandButton value="Salvar objetivo"
                                 action="#{goalBean.create()}"
                                 update=":frm:mensagem :frm"
                                 styleClass="btn btn-primary"
                                 rendered="#{goalBean.action != 'Excluir' and goalBean.action != 'Alterar'}" />

                <p:commandButton value="Atualizar objetivo"
                                 action="#{goalBean.update()}"
                                 update=":frm:mensagem :frm"
                                 styleClass="btn btn-primary"
                                 rendered="#{goalBean.action == 'Alterar'}" />

                <p:commandButton value="Confirmar exclusão"
                                 action="#{goalBean.deleteAndRedirect()}"
                                 styleClass="btn btn-danger"
                                 rendered="#{goalBean.action == 'Excluir'}" />

                <p:commandButton value="Limpar"
                                 type="button"
                                 styleClass="btn btn-secondary js-clear-form"
                                 rendered="#{goalBean.action != 'Excluir'}" />

                <p:button value="Voltar"
                          outcome="/uc/objetivo/consultaObjetivo.xhtml"
                          styleClass="btn btn-subtle" />
            </div>
        </h:form>
    </ui:define>
</ui:composition>
