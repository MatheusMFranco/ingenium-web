<!DOCTYPE html>
<ui:composition template="/WEB-INF/templates/Layout.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">

    <ui:define name="corpo">
        <section class="page-shell">
            <header class="page-header">
                <div>
                    <h1 class="page-title">Gestão de Objetivos</h1>
                    <p class="page-subtitle">Controle metas, prazos e progresso no mesmo fluxo.</p>
                </div>
                <span class="status-pill">Módulo Objetivos</span>
            </header>

            <h:form id="frmLista" styleClass="surface-card table-shell">
            <div class="table-shell__header">
                <div>
                    <h1 class="table-shell__title">Objetivos cadastrados</h1>
                    <p class="table-shell__subtitle">Acompanhe prazos, tipos de duração e categorias dos objetivos.</p>
                </div>

                <p:button value="Novo objetivo"
                          outcome="cadastraObjetivo.xhtml"
                          styleClass="btn btn-primary">
                    <f:param name="objAcao" value="Novo" />
                </p:button>
            </div>

            <p:messages id="mensagem" closable="true" showDetail="true" />

            <p:dataTable var="objetivo"
                         value="#{goalBean.lazyModel}"
                         id="tabObjetivo"
                         lazy="true"
                         emptyMessage="Nenhum objetivo encontrado"
                         rows="10"
                         paginator="true"
                         reflow="true"
                         paginatorPosition="bottom"
                         currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords}"
                         paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}">

                <p:column headerText="Ações" style="width:180px">
                    <div class="table-actions">
                        <p:button value="Editar" outcome="cadastraObjetivo.xhtml" styleClass="btn-inline btn-secondary">
                            <f:param name="objCod" value="#{objetivo.id}" />
                            <f:param name="objAcao" value="Alterar" />
                        </p:button>
                        <p:button value="Excluir" outcome="cadastraObjetivo.xhtml" styleClass="btn-inline btn-danger">
                            <f:param name="objCod" value="#{objetivo.id}" />
                            <f:param name="objAcao" value="Excluir" />
                        </p:button>
                    </div>
                </p:column>

                <p:column headerText="Nome" filterBy="#{objetivo.name}" filterMatchMode="contains">
                    <h:outputText value="#{objetivo.name}" />
                </p:column>

                <p:column headerText="Categoria" filterBy="#{objetivo.category.name}" filterMatchMode="contains">
                    <h:outputText value="#{objetivo.category.name}" />
                </p:column>

                <p:column headerText="Tipo de duração" filterBy="#{objetivo.durationType.label}" filterMatchMode="contains">
                    <h:outputText value="#{objetivo.durationType.label}" />
                </p:column>

                <p:column headerText="Início">
                    <h:outputText value="#{objetivo.startDate}">
                        <f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
                    </h:outputText>
                </p:column>

                <p:column headerText="Fim">
                    <h:outputText value="#{objetivo.endDate}">
                        <f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
                    </h:outputText>
                </p:column>
            </p:dataTable>
        </h:form>
        </section>
    </ui:define>
</ui:composition>
